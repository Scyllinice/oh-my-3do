; Copy beside boot.iso. Also editable in Tools > Configuration.
; Non-display changes apply after a cold boot.
[compatibility]
; 0 normal; 1 folder-ID workaround.
folder_workaround=0

[artwork]
; 0 disables USB cover reads; 1 enables them.
usb_covers=1
; Silent USB clips, 0/1.
video_previews=0

[display]
; Margin: 0-12 pixels. Large titles: 0/1.
screen_margin=0
large_titles=0
; Theme: 0 teal, 1 high contrast, 2 amber.
theme=0

[library]
remember_position=1
recent_games=1
