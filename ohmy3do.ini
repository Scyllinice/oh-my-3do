; Oh My 3DO settings. Keep this file in .ohmy3do/ on the USB drive.
[compatibility]
; Folder-ID workaround for the FCare firmware: 0 automatic, 1 always, 2 off.
folder_workaround=0

[artwork]
usb_covers=1
video_previews=1

[display]
; Margin: 0-12. Large titles: 0/1.
screen_margin=0
large_titles=0

[library]
remember_position=1
recent_games=1
; 1 hides the Adult category.
hide_adult=0

[audio]
; Preview audio only; the menu has no background music.
preview_sound=1
