; Copy beside boot.iso on the USB drive. Edit on a PC, then cold boot.
; 0 = normal navigation; 1 = opt into the FCare folder-ID workaround.
[compatibility]
folder_workaround=0

[artwork]
; 0 disables USB cover reads while keeping the compatibility setting above.
usb_covers=1

[display]
; Additional inset: 0-12 pixels. C on the Display screen saves these values.
screen_margin=0
; 1 uses larger game/queue titles and seven rows per page.
large_titles=0
; 0 teal, 1 high contrast, 2 amber.
theme=0
