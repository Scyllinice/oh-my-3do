[package]
name = "oh-my-3do-desktop"
version = "1.0.3"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[[bin]]
name = "oh-my-3do-library"
path = "src/main.rs"

[dependencies]
oh-my-3do-library = { path = "..", default-features = false }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
strip = true
